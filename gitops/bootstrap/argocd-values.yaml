# Helm values for ArgoCD, installed by scripts/bootstrap.sh (chart argo/argo-cd).
# ArgoCD is the only component installed from outside git; everything else is
# declared under gitops/apps and synced by ArgoCD itself.
#
# Sized for a single-node local cluster: components the setup does not use are off.

dex:
  # No SSO for a local cluster; the built-in admin user is enough.
  enabled: false

notifications:
  # ArgoCD Notifications are out of scope.
  enabled: false

# Time to fetch a Helm chart. Pulling from a Helm repository first downloads
# the repository's whole index (kube-prometheus-stack's is about 7 MB), then
# the chart. By default the repo server gives helm 90 seconds for both, and
# the controller waits 60 seconds for the repo server; on a slow link that cuts
# the pull short, and every retry starts over. With five minutes for both, the
# only limit left is helm's own, two minutes per download. After the first
# pull, ArgoCD serves the rendered manifests from its cache.
configs:
  params:
    controller.repo.server.timeout.seconds: 300
repoServer:
  env:
    - name: ARGOCD_EXEC_TIMEOUT
      value: 5m
