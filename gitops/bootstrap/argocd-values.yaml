# Helm values for ArgoCD, installed by scripts/bootstrap.sh (chart argo/argo-cd).
# ArgoCD is the only component installed from outside git; everything else is
# declared under gitops/apps and synced by ArgoCD itself.
#
# Sized for a single-node local cluster: components the setup does not use are off.

dex:
  # No SSO for a local cluster; the built-in admin user is enough.
  enabled: false

notifications:
  # ArgoCD Notifications are out of scope.
  enabled: false

# Time to fetch a Helm chart. Pulling from a Helm repository first downloads the
# repository's whole index (kube-prometheus-stack's is about 7 MB). By default,
# the repo server gives helm 90 seconds and the controller waits 60 seconds for
# the repo server. On a slow link the pull takes longer than that, and every
# retry starts over. With five minutes for both, the first pull finishes; after
# that, ArgoCD serves the rendered manifests from its cache.
configs:
  params:
    controller.repo.server.timeout.seconds: 300
repoServer:
  env:
    - name: ARGOCD_EXEC_TIMEOUT
      value: 5m
