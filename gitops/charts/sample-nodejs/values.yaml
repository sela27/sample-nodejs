# Chart defaults: everything that is the same in every Environment.
# Each Environment's values file (values-<environment>.yaml) adds the image and
# the Ingress host.

replicaCount: 1

# The app's configuration. The chart puts it in a ConfigMap that the container
# loads as environment variables, and a change to it rolls the pods.
config:
  # PORT, the port the app listens on. The container port uses the same value,
  # and the probes and the Service reach the app through that port.
  port: 8080
  # NODE_ENV. It overrides the NODE_ENV that the image sets.
  nodeEnv: production

image:
  # Set by each Environment's values file.
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
  # The registry pull secret for the private image. Bootstrap creates it in
  # the app namespace (ADR-0003); the chart only refers to it by name, through
  # the ServiceAccount.
  pullSecret: ghcr-pull

# Requests are what the scheduler reserves per pod; limits cap a single pod so
# it cannot starve the node. The app idles at about 40 MiB.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

ingress:
  className: traefik
  # Set by each Environment's values file.
  host: ""
  # The Public paths: the only app paths reachable from outside the cluster.
  # Each is a Prefix match, so /my-app also covers /my-app/..., but not
  # /my-appx. Every other path, such as /classified, /metrics, /ready and
  # /live, has no route and stays internal.
  publicPaths:
    - /my-app
    - /about
  # HTTPS through cert-manager, off by default. When on, the Ingress gets a TLS
  # section for the host, and cert-manager issues the certificate.
  tls:
    enabled: false
    # The cert-manager ClusterIssuer that signs the certificate. It depends on
    # the cluster, so the Environment's values file sets it with the flag.
    clusterIssuer: ""
