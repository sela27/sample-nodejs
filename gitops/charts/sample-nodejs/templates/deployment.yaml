apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sample-nodejs.fullname" . }}
  labels:
    {{- include "sample-nodejs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "sample-nodejs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sample-nodejs.labels" . | nindent 8 }}
    spec:
      containers:
        - name: app
          image: {{ include "sample-nodejs.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            # The app's default PORT. The probes and the Service refer to it by name.
            - name: http
              containerPort: 8080
              protocol: TCP
          # Holds off the other probes until the app has started once, so a slow
          # start is not mistaken for a hung process.
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # Restarts the container if the process stops answering.
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Sends Service traffic only to pods that answer here.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
