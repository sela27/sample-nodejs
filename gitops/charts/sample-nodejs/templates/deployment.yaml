apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sample-nodejs.fullname" . }}
  labels:
    {{- include "sample-nodejs.labels" . | nindent 4 }}
spec:
  # With the HPA on, the HPA owns the replica count and the Deployment leaves
  # it out. If the Deployment set it, every ArgoCD sync would put back the
  # count from git over the count the HPA chose.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # A rollout starts the new pod first and removes an old one only once the new
  # one is ready, so the number of ready pods never drops below the count.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # A rollout that makes no progress for this long (a new pod that never turns
  # ready, say) is marked failed, and ArgoCD then shows the Deployment as
  # Degraded. The default is ten minutes, too long to wait. Three minutes
  # covers an image pull and the startup probe (up to 30 s) with room to spare.
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      {{- include "sample-nodejs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sample-nodejs.labels" . | nindent 8 }}
      annotations:
        # A change to the ConfigMap alone restarts no pod, because environment
        # variables are read only at container start. This checksum of the
        # ConfigMap's data changes the pod template with it, so the pods roll.
        checksum/config: {{ include "sample-nodejs.config" . | sha256sum }}
    spec:
      serviceAccountName: {{ include "sample-nodejs.fullname" . }}
      # Also set on the ServiceAccount; set here too, because the pod's own
      # setting is the one that wins.
      automountServiceAccountToken: false
      # Time from the start of termination to SIGKILL. It covers the preStop
      # pause (5 s) and then the app's own shutdown, which waits up to
      # SHUTDOWN_TIMEOUT_MS (10 s by default) for open connections. 30 s leaves
      # 15 s to spare.
      terminationGracePeriodSeconds: 30
      # The restricted Pod Security profile. These settings are written here,
      # not taken from values, so no Environment's values file can loosen them.
      securityContext:
        runAsNonRoot: true
        # The image's node user and group.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: {{ include "sample-nodejs.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            # The app writes nothing to disk, so it needs no writable path.
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # PORT and NODE_ENV from the ConfigMap. They override the image's own
          # environment variables of the same name.
          envFrom:
            - configMapRef:
                name: {{ include "sample-nodejs.fullname" . }}
          ports:
            # The same value as PORT in the ConfigMap, so the two cannot drift
            # apart. The probes and the Service refer to it by name.
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          # Runs before SIGTERM. Kubernetes removes the pod from the Service's
          # endpoints at the same moment it starts terminating, but Traefik
          # learns of that a little later and may still send requests meanwhile.
          # The pause keeps the app serving until Traefik has dropped the pod.
          # The native sleep action needs no shell in the image (Kubernetes 1.30+).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Holds off the other probes until the app has started once, so a slow
          # start is not mistaken for a hung process.
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # Restarts the container if the process stops answering.
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Sends Service traffic only to pods that answer here.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
