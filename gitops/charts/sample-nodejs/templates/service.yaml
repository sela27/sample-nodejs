apiVersion: v1
kind: Service
metadata:
  name: {{ include "sample-nodejs.fullname" . }}
  labels:
    {{- include "sample-nodejs.labels" . | nindent 4 }}
spec:
  # Reachable only inside the cluster; outside traffic comes through the Ingress.
  type: ClusterIP
  selector:
    {{- include "sample-nodejs.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
