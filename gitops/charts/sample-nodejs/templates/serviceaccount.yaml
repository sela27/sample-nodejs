apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sample-nodejs.fullname" . }}
  labels:
    {{- include "sample-nodejs.labels" . | nindent 4 }}
# The app never calls the Kubernetes API, so its pods get no API token and the
# ServiceAccount has no RBAC binding.
automountServiceAccountToken: false
# Every pod under this ServiceAccount pulls the private image with this secret.
imagePullSecrets:
  - name: {{ required "image.pullSecret must name the registry pull secret that Bootstrap creates" .Values.image.pullSecret | quote }}
