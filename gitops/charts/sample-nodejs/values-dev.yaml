# The dev Environment: the chart defaults in values.yaml plus these values.

image:
  repository: ghcr.io/sela27/sample-nodejs
  # The Release that dev runs. The Bump commit (scripts/bump-dev-image-tag.sh)
  # is the only writer of this line, and it always sets a Release version,
  # never `latest`. Seeded by hand to 1.0.0, the first Release.
  tag: 1.1.0

ingress:
  # nip.io resolves this name to 127.0.0.1, where `minikube tunnel` exposes
  # Traefik, so no hosts-file edit is needed.
  host: sample-nodejs.127.0.0.1.nip.io
  # HTTPS with a self-signed certificate: cert-manager (gitops/apps/cert-manager.yaml)
  # issues it from the ClusterIssuer that gitops/cluster-issuer delivers. Plain
  # HTTP on port 80 keeps working; there is no redirect.
  tls:
    enabled: true
    clusterIssuer: selfsigned-issuer

# Prometheus from kube-prometheus-stack (gitops/apps/kube-prometheus-stack.yaml)
# scrapes /metrics through this ServiceMonitor. It selects ServiceMonitors by
# its release name, and runs in the namespace that networkPolicy.monitoring
# admits by default (monitoring).
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
