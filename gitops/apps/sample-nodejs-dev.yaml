# The dev Environment: our chart with the dev values, deployed by ArgoCD.
# ArgoCD renders the chart from main, so a Bump commit there (a new image tag in
# values-dev.yaml) or a chart change is Deployed with no manual step.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-nodejs-dev
  namespace: argocd
  # Deleting this Application (or removing this file from git) also deletes
  # the app resources it created. The namespace and the pull secret stay,
  # because Bootstrap created them, not ArgoCD.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sela27/sample-nodejs.git
    targetRevision: chore/30-monitoring-stack
    path: gitops/charts/sample-nodejs
    helm:
      # Object names start with the release name (sample-nodejs-dev), the
      # release name scripts/check-chart.sh renders the chart with.
      releaseName: sample-nodejs-dev
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    # Bootstrap creates this namespace first, with the restricted Pod Security
    # labels and the registry pull secret (ADR-0003).
    namespace: sample-nodejs-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Bootstrap normally creates the namespace already. If it is missing,
      # ArgoCD creates it, without the labels or the pull secret, and a re-run
      # of Bootstrap adds both.
      - CreateNamespace=true
    # Retries a failed sync, such as the ServiceMonitor arriving before
    # kube-prometheus-stack has installed its CRD: 15 times, 10 s apart at
    # first, doubling up to 3 minutes, so for about half an hour in all.
    retry:
      limit: 15
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
