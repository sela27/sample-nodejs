# SonarQube Cloud analysis settings, read by the scanner in the sast jobs of
# .github/workflows/pr.yml and sast-main.yml. scripts/sast-gate.js reads the
# organization and the project key from here too.
sonar.organization=sela27
sonar.projectKey=sela27_sample-nodejs
sonar.projectName=sample-nodejs

# Everything in the repo is analyzed as source (the app, the scripts, the
# Dockerfile, the chart and the workflows), except the tests, which are
# analyzed as tests, and the third-party schemas vendored for kubeconform.
sonar.sources=.
sonar.exclusions=test/**,scripts/schemas/**
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Line coverage of the tests, written by the sast job before the scan.
sonar.javascript.lcov.reportPaths=lcov.info
