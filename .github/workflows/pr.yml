# PR pipeline: the checks every pull request to main must pass.
#
# Each job id below is a required status check on main, listed in
# REQUIRED_CHECKS in scripts/protect-main.sh. GitHub names the check after the
# job id because no job sets `name:`, so renaming a job id breaks merging until
# the ruleset is updated. New Gates are appended as further jobs at the end of
# this file and to that list.
#
# Third-party actions are pinned by full commit SHA, with the version in a
# trailing comment, so a moved or hijacked tag cannot change what runs here.
name: PR

on:
  pull_request:
    branches: [main]

# Read-only by default. A job that needs more asks for it in its own
# `permissions:` block.
permissions:
  contents: read

# A new push to the same PR supersedes the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Unit tests: drive the app through its HTTP interface (test/).
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  # Dockerfile lint with hadolint. Warnings and errors fail the check;
  # info and style findings are reported but do not fail it.
  dockerfile-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # Helm chart: helm lint, then the chart rendered with the dev values, with
  # Ingress TLS off and on and with the ServiceMonitor on, is validated against the Kubernetes schemas
  # (kubeconform, strict) and checked for what it must promise (Public paths
  # only, probes, ports, pod hardening, ServiceAccount, app configuration and
  # its rollout checksum, labels, the TLS and ServiceMonitor flags). The
  # ServiceMonitor is validated against its CRD schema, vendored in
  # scripts/schemas, so the job downloads no schema.
  # scripts/check-chart.sh holds the checks, so a local run matches this job.
  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Each tool is pinned by version and by the SHA-256 of its linux-amd64
      # release file, so a replaced download fails the job instead of running.
      # The runner's preinstalled helm and yq are not used.
      HELM_VERSION: v4.1.4
      HELM_SHA256: 70b2c30a19da4db264dfd68c8a3664e05093a361cefd89572ffb36f8abfa3d09
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      YQ_VERSION: v4.54.1
      YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned helm, kubeconform and yq
        # get.helm.sh sometimes answers 504; retry instead of failing the check.
        # GitHub release assets come through the API with the read-only job
        # token, so throttling of anonymous downloads cannot fail the check.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          gh release download "${KUBECONFORM_VERSION}" --repo yannh/kubeconform \
            --pattern kubeconform-linux-amd64.tar.gz --output kubeconform.tar.gz
          gh release download "${YQ_VERSION}" --repo mikefarah/yq \
            --pattern yq_linux_amd64 --output yq
          sha256sum -c - <<EOF
          ${HELM_SHA256}  helm.tar.gz
          ${KUBECONFORM_SHA256}  kubeconform.tar.gz
          ${YQ_SHA256}  yq
          EOF
          tar -xzf helm.tar.gz -C "$bin" --strip-components=1 linux-amd64/helm
          tar -xzf kubeconform.tar.gz -C "$bin" kubeconform
          install -m 0755 yq "$bin/yq"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/helm" version --short
          "$bin/kubeconform" -v
          "$bin/yq" --version
      - run: scripts/check-chart.sh

  # Secret scan with gitleaks and its default rules, over every commit this PR
  # brings: those reachable from the PR head but not from the base branch. A
  # secret added in one commit and removed in a later one is still caught,
  # because it stays in the PR's history on GitHub. Any finding fails the
  # check. Findings are printed redacted, so the public job log does not repeat
  # the leaked value.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Pinned by version and by the SHA-256 of its linux-x64 release file, like
      # the tools in the chart job.
      GITLEAKS_VERSION: v8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so both ends of the PR's commit range are present.
          fetch-depth: 0
      - name: Install pinned gitleaks
        # Through the API with the read-only job token, so throttling of
        # anonymous downloads cannot fail the check.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          gh release download "${GITLEAKS_VERSION}" --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" --output gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/gitleaks" version
      - name: Scan the commits this PR brings
        run: gitleaks git --no-banner --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  # Image Gate: the image is built with BuildKit and loaded into the runner's
  # Docker engine. It is never pushed, and no step logs in to a registry.
  # Trivy then scans it and fails the check on any HIGH or CRITICAL
  # vulnerability, in Alpine or in the app's dependencies, including findings
  # with no fixed version yet. Accepted exceptions live in .trivyignore, each
  # with its justification.
  image-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Trivy is pinned by version and by the SHA-256 of its Linux-64bit
      # release file, the same way as the tools in the chart job, instead of
      # through aquasecurity/trivy-action or setup-trivy, whose tags were
      # hijacked on 2026-03-19 (CVE-2026-33634). 0.76.2 is an immutable
      # GitHub release, outside the compromised 0.69.4-0.69.6, and past every
      # published Trivy advisory. The image job in release.yml runs the same
      # scan before every push to GHCR; keep its two values in step.
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      IMAGE: sample-nodejs:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # gh fetches the release file through the GitHub API with the job's
      # read-only token. Anonymous downloads from github.com/.../releases
      # returned 504 during GitHub's 2026-11-09 incident while the API kept
      # serving the same file.
      - name: Install pinned Trivy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          gh release download "v${TRIVY_VERSION}" --repo aquasecurity/trivy \
            --pattern "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" --output trivy.tar.gz
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C "$bin" trivy
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/trivy" --version
      - name: Build the image with BuildKit, loaded locally and not pushed
        run: |
          docker buildx version
          docker buildx build --load --tag "$IMAGE" .
      # --image-src docker scans the image just built in the local engine and
      # never pulls one from a registry. --ignore-unfixed is not set, so a
      # finding without a fixed version still fails the check.
      - name: Scan the image for HIGH and CRITICAL vulnerabilities
        run: |
          trivy image \
            --image-src docker \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --format table \
            --exit-code 1 \
            --no-progress \
            "$IMAGE"

  # IaC Gate: Trivy's misconfiguration checks over the Dockerfile and over the
  # chart as ArgoCD applies it, rendered by helm with the dev values rather
  # than scanned as raw templates. Any HIGH or CRITICAL finding fails the
  # check. Accepted exceptions live in .trivyignore, each with its
  # justification. scripts/check-iac.sh holds the scan, so a local run matches
  # this job.
  iac-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # The same pins as helm in the chart job and Trivy in image-gate; keep
      # them in step.
      HELM_VERSION: v4.1.4
      HELM_SHA256: 70b2c30a19da4db264dfd68c8a3664e05093a361cefd89572ffb36f8abfa3d09
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Retries for get.helm.sh and the API for the GitHub release, for the
      # same reasons as in the chart and image-gate jobs. These are the job's
      # only downloads: the scan uses the checks embedded in the pinned Trivy
      # binary and does not fetch Trivy's checks bundle.
      - name: Install pinned helm and Trivy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          gh release download "v${TRIVY_VERSION}" --repo aquasecurity/trivy \
            --pattern "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" --output trivy.tar.gz
          sha256sum -c - <<EOF
          ${HELM_SHA256}  helm.tar.gz
          ${TRIVY_SHA256}  trivy.tar.gz
          EOF
          tar -xzf helm.tar.gz -C "$bin" --strip-components=1 linux-amd64/helm
          tar -xzf trivy.tar.gz -C "$bin" trivy
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/helm" version --short
      - run: scripts/check-iac.sh
