# PR pipeline: the checks every pull request to main must pass.
#
# Each job id below is a required status check on main, listed in
# REQUIRED_CHECKS in scripts/protect-main.sh. GitHub names the check after the
# job id because no job sets `name:`, so renaming a job id breaks merging until
# the ruleset is updated. New Gates are appended as further jobs at the end of
# this file and to that list.
#
# Third-party actions are pinned by full commit SHA, with the version in a
# trailing comment, so a moved or hijacked tag cannot change what runs here.
name: PR

on:
  pull_request:
    branches: [main]

# Read-only by default. A job that needs more asks for it in its own
# `permissions:` block.
permissions:
  contents: read

# A new push to the same PR supersedes the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Unit tests: drive the app through its HTTP interface (test/).
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  # Dockerfile lint with hadolint. Warnings and errors fail the check;
  # info and style findings are reported but do not fail it.
  dockerfile-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # Helm chart: helm lint, then the chart rendered with the dev values is
  # validated against the Kubernetes schemas (kubeconform, strict) and checked
  # for what it must promise (Public paths only, probes, ports, labels).
  # scripts/check-chart.sh holds the checks, so a local run matches this job.
  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Each tool is pinned by version and by the SHA-256 of its linux-amd64
      # release file, so a replaced download fails the job instead of running.
      # The runner's preinstalled helm and yq are not used.
      HELM_VERSION: v4.1.4
      HELM_SHA256: 70b2c30a19da4db264dfd68c8a3664e05093a361cefd89572ffb36f8abfa3d09
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      YQ_VERSION: v4.54.1
      YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned helm, kubeconform and yq
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sha256sum -c - <<EOF
          ${HELM_SHA256}  helm.tar.gz
          ${KUBECONFORM_SHA256}  kubeconform.tar.gz
          ${YQ_SHA256}  yq
          EOF
          tar -xzf helm.tar.gz -C "$bin" --strip-components=1 linux-amd64/helm
          tar -xzf kubeconform.tar.gz -C "$bin" kubeconform
          install -m 0755 yq "$bin/yq"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/helm" version --short
          "$bin/kubeconform" -v
          "$bin/yq" --version
      - run: scripts/check-chart.sh

  # Image Gate: the image is built with BuildKit and loaded into the runner's
  # Docker engine. It is never pushed, and no step logs in to a registry.
  # Trivy then scans it and fails the check on any HIGH or CRITICAL
  # vulnerability, in Alpine or in the app's dependencies, including findings
  # with no fixed version yet. Accepted exceptions live in .trivyignore, each
  # with its justification.
  image-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Trivy is pinned by version and by the SHA-256 of its Linux-64bit
      # release file, the same way as the tools in the chart job, instead of
      # through aquasecurity/trivy-action or setup-trivy, whose tags were
      # hijacked on 2026-03-19 (CVE-2026-33634). 0.76.2 is an immutable
      # GitHub release, outside the compromised 0.69.4-0.69.6, and past every
      # published Trivy advisory.
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      IMAGE: sample-nodejs:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Trivy
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C "$bin" trivy
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/trivy" --version
      - name: Build the image with BuildKit, loaded locally and not pushed
        run: |
          docker buildx version
          docker buildx build --load --tag "$IMAGE" .
      # --image-src docker scans the image just built in the local engine and
      # never pulls one from a registry. --ignore-unfixed is not set, so a
      # finding without a fixed version still fails the check.
      - name: Scan the image for HIGH and CRITICAL vulnerabilities
        run: |
          trivy image \
            --image-src docker \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore \
            --format table \
            --exit-code 1 \
            --no-progress \
            "$IMAGE"
